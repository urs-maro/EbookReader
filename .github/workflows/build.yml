name: Build CRIO-Books-Reader APK

on:
  push:
    paths:
      - "app/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install SDK packages the app needs
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;37.0.0" >/dev/null

      - name: Build + unit tests
        run: ./gradlew testDebugUnitTest assembleDebug

      - name: Name the APK with the app version
        id: apk
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cp app/build/outputs/apk/debug/CRIO-Books-Reader-debug.apk "CRIO-Books-Reader.apk"
          cp app/build/outputs/apk/debug/CRIO-Books-Reader-debug.apk "CRIO-Books-Reader-v$VER.apk"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"

      - name: Remove previous APKs from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for a in $(gh release view latest --json assets -q '.assets[].name' 2>/dev/null); do
            gh release delete-asset latest "$a" --yes || true
          done

      - name: Publish APK to the fixed "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: CRIO-Books-Reader v${{ steps.apk.outputs.ver }}
          body: "CRIO-Books-Reader v${{ steps.apk.outputs.ver }} — build automat"
          files: |
            CRIO-Books-Reader.apk
            CRIO-Books-Reader-v${{ steps.apk.outputs.ver }}.apk
